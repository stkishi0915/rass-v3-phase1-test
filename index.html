<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RASS v3 Step 2 Update Test</title>

  <style>
    body {
      font-family: system-ui, sans-serif;
      max-width: 900px;
      margin: 40px auto;
      padding: 0 20px;
      line-height: 1.6;
      color: #1f2937;
    }

    button {
      padding: 10px 16px;
      margin: 0 8px 8px 0;
      border: 1px solid #94a3b8;
      border-radius: 8px;
      background: white;
      cursor: pointer;
    }

    button:disabled {
      opacity: .5;
      cursor: not-allowed;
    }

    #out {
      white-space: pre-wrap;
      word-break: break-word;
      background: #f8fafc;
      border: 1px solid #e5e7eb;
      border-radius: 10px;
      padding: 16px;
      margin-top: 18px;
      min-height: 250px;
    }

    .note {
      background: #eff6ff;
      border: 1px solid #bfdbfe;
      padding: 14px;
      border-radius: 10px;
      margin: 16px 0;
    }
  </style>
</head>

<body>

<h1>RASS v3 Step 2 Update Test</h1>

<div class="note">
  このページは、Supabaseの rass_sessions.current_step を
  「1 → 2」に更新できるかを確認する専用テストです。
</div>

<button id="login">匿名ログイン</button>
<button id="send" disabled>Step 2へ更新</button>

<pre id="out">まず「匿名ログイン」をクリックしてください。</pre>

<script type="module">

import {
  createClient
} from "https://esm.sh/@supabase/supabase-js@2";


// =========================================================
// Supabase
// =========================================================

const SUPABASE_URL =
  "https://vifxsktvfhsepnasfmpq.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
  "sb_publishable_flQ-6JFCEMEmeRKOBkdrug_WY1CBMmP";

const FUNCTION_URL =
  `${SUPABASE_URL}/functions/v1/rass-chat`;

const supabase =
  createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
  );


// =========================================================
// DOM
// =========================================================

const out =
  document.getElementById("out");

const login =
  document.getElementById("login");

const send =
  document.getElementById("send");


// =========================================================
// Login
// =========================================================

login.addEventListener(
  "click",
  async () => {

    login.disabled = true;

    out.textContent =
      "匿名ログイン中…";

    try {

      const {
        data,
        error
      } =
        await supabase.auth.signInAnonymously();

      if (error) {
        throw error;
      }

      const session =
        data?.session;

      if (!session?.user?.id) {
        throw new Error(
          "匿名ユーザーを取得できませんでした。"
        );
      }

      out.textContent =
        [
          "匿名ログイン成功",
          "",
          `ユーザーID: ${session.user.id}`,
          "",
          "次に「Step 2へ更新」をクリックしてください。"
        ].join("\n");

      send.disabled = false;

    } catch (error) {

      console.error(error);

      out.textContent =
        [
          "LOGIN ERROR",
          "",
          error?.message ||
            String(error)
        ].join("\n");

      login.disabled = false;
    }
  }
);


// =========================================================
// Step 2 update test
// =========================================================

send.addEventListener(
  "click",
  async () => {

    send.disabled = true;

    out.textContent =
      "Step 2更新を送信中…";

    try {

      // -----------------------------------------------------
      // Get current session
      // -----------------------------------------------------

      const {
        data,
        error
      } =
        await supabase.auth.getSession();

      if (error) {
        throw error;
      }

      const session =
        data?.session;

      if (!session) {
        throw new Error(
          "Supabase session がありません。"
        );
      }


      // -----------------------------------------------------
      // IMPORTANT
      // ここで必ず current_step: 2 を送る
      // -----------------------------------------------------

      const requestBody = {

        query:
          "Step 2へ進みます",

        current_step:
          2,

        conversation_id:
          "",

        inputs: {}
      };


      // -----------------------------------------------------
      // Display request before sending
      // -----------------------------------------------------

      out.textContent =
        [
          "送信するデータ:",
          "",
          JSON.stringify(
            requestBody,
            null,
            2
          ),
          "",
          "送信中…"
        ].join("\n");


      // -----------------------------------------------------
      // Direct fetch
      // -----------------------------------------------------

      const response =
        await fetch(
          FUNCTION_URL,
          {
            method: "POST",

            headers: {
              "Content-Type":
                "application/json",

              "Authorization":
                `Bearer ${session.access_token}`,

              "apikey":
                SUPABASE_PUBLISHABLE_KEY
            },

            body:
              JSON.stringify(
                requestBody
              )
          }
        );


      // -----------------------------------------------------
      // Read response
      // -----------------------------------------------------

      const rawBody =
        await response.text();

      let parsedBody = null;

      try {
        parsedBody =
          JSON.parse(rawBody);
      } catch {
        parsedBody = null;
      }


      // -----------------------------------------------------
      // Display
      // -----------------------------------------------------

      out.textContent =
        [
          "HTTP RESULT",
          "",
          `status: ${response.status}`,
          "",
          "送信したデータ:",
          JSON.stringify(
            requestBody,
            null,
            2
          ),
          "",
          "Edge Function response:",
          rawBody,
          "",
          "判定:",
          parsedBody
            ? JSON.stringify(
                {
                  requested_step:
                    parsedBody.debug?.requested_step,

                  current_step:
                    parsedBody.debug?.current_step,

                  step_updated:
                    parsedBody.debug?.step_updated,

                  session_current_step:
                    parsedBody.session?.current_step
                },
                null,
                2
              )
            : "(JSONではありません)"
        ].join("\n");

    } catch (error) {

      console.error(error);

      out.textContent =
        [
          "CLIENT ERROR",
          "",
          error?.message ||
            String(error)
        ].join("\n");

    } finally {

      send.disabled = false;
    }
  }
);

</script>

</body>
</html>
