<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RASS v3 Phase 1 API Test</title>
  <style>
    body{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;max-width:900px;margin:40px auto;padding:0 20px;line-height:1.6;color:#1f2937}
    button{padding:10px 16px;border-radius:8px;border:1px solid #94a3b8;background:#fff;cursor:pointer;margin-right:8px}
    button:disabled{opacity:.5;cursor:not-allowed}
    #out{white-space:pre-wrap;background:#f8fafc;border:1px solid #e5e7eb;border-radius:10px;padding:16px;margin-top:18px;min-height:120px}
    .note{background:#eff6ff;border:1px solid #bfdbfe;padding:12px 14px;border-radius:10px;margin:16px 0}
    code{background:#f1f5f9;padding:2px 5px;border-radius:4px}
  </style>
</head>
<body>
  <h1>RASS v3 Phase 1 API Test</h1>
  <div class="note">
    このページは Phase 1 の疎通確認用です。Dify APIキーはこのHTMLには保存していません。
  </div>

  <button id="login">匿名ログイン</button>
  <button id="send" disabled>こんにちはを送信</button>
  <pre id="out">準備完了。まず「匿名ログイン」をクリックしてください。</pre>

  <script type="module">
    import { createClient } from "https://esm.sh/@supabase/supabase-js@2";

    // Public values only. The Dify API key is NOT stored in this file.
    const SUPABASE_URL = "https://vifxsktvfhsepnasfmpq.supabase.co";
    const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_flQ-6JFCEMEmeRKOBkdrug_WY1CBMmP";

    const supabase = createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);
    const out = document.getElementById("out");
    const send = document.getElementById("send");
    const login = document.getElementById("login");

    let conversationId = "";

    async function ensureSession() {
      const { data } = await supabase.auth.getSession();
      if (data?.session) return data.session;

      const { data: signInData, error } = await supabase.auth.signInAnonymously();
      if (error) throw error;
      return signInData?.session ?? null;
    }

    async function sendRassMessage(query) {
      if (!query || typeof query !== "string") {
        throw new Error("query is required");
      }

      const { data, error } = await supabase.functions.invoke("rass-chat", {
        body: {
          query,
          conversation_id: conversationId,
          inputs: {}
        }
      });

      if (error) {
        throw new Error(error.message || "RASS API request failed");
      }

      if (!data?.ok) {
        throw new Error(data?.error || "RASS API request failed");
      }

      return {
        answer: data.answer || "",
        conversationId: data.conversation_id || "",
        messageId: data.message_id || ""
      };
    }

    login.addEventListener("click", async () => {
      login.disabled = true;
      out.textContent = "匿名ログイン中…";

      try {
        const session = await ensureSession();
        if (!session?.user?.id) {
          throw new Error("匿名ユーザーの取得に失敗しました。");
        }
        out.textContent = `匿名ログイン成功\nユーザーID: ${session.user.id}\n\n次に「こんにちはを送信」をクリックしてください。`;
        send.disabled = false;
      } catch (error) {
        console.error(error);
        out.textContent = `ログインエラー: ${error?.message || error}`;
        login.disabled = false;
      }
    });

    send.addEventListener("click", async () => {
      send.disabled = true;
      out.textContent += "\n\nDifyへ送信中…";

      try {
        const result = await sendRassMessage("こんにちは");
        conversationId = result.conversationId;
        out.textContent = [
          `回答: ${result.answer}`,
          `conversation_id: ${conversationId || "(なし)"}`,
          `message_id: ${result.messageId || "(なし)"}`
        ].join("\n\n");
      } catch (error) {
        console.error(error);
        out.textContent = `APIエラー: ${error?.message || error}`;
      } finally {
        send.disabled = false;
      }
    });
  </script>
</body>
</html>
